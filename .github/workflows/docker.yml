name: "Docker"

on:
  workflow_call:
    inputs:
      ubuntu-version:
        description: "Ubuntu version"
        required: false
        default: "ubuntu-24.04"
        type: string

permissions:
  contents: read

jobs:
  server:
    runs-on: ${{ inputs.ubuntu-version }}

    steps:
    - uses: actions/checkout@v7

    - run: docker build .
      working-directory: ./server
      timeout-minutes: 10

  client:
    runs-on: ${{ inputs.ubuntu-version }}

    steps:
    - uses: actions/checkout@v7

    - run: docker build .
      working-directory: ./client
      timeout-minutes: 20
